[build]
  command = "bun run build"
  # Nitro's Netlify preset writes static assets to dist/ and the SSR function
  # to .netlify/functions-internal, which Netlify picks up automatically.
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Pin Nitro's target so the build never falls back to the Cloudflare default.
  NITRO_PRESET = "netlify"
